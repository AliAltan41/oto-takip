<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esnaf Plaka ve Borç Takip Sistemi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f3f4f6; color: #1f2937; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { font-size: 1.25rem; margin-bottom: 16px; color: #111; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #4b5563; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; }
        .btn-save { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn-save.edit-mode { background: #d97706; }
        .btn-cancel { width: 100%; background: #6b7280; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 6px; display: none; }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
        .search-box { margin: 20px 0; border-top: 1px solid #e5e7eb; padding-top: 16px; }
        .list-item { background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .item-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .debt { color: #dc2626; font-weight: bold; }
        .paid { color: #16a34a; font-weight: bold; }
        .btn-group { display: flex; gap: 6px; }
        .btn-action { flex: 1; padding: 8px 6px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; border: none; cursor: pointer; color: white; text-align: center; }
        .btn-wa { background: #25D366; flex: 1.4; }
        .btn-edit { background: #f59e0b; }
        .btn-del { background: #ef4444; }
        .loading { text-align: center; color: #6b7280; padding: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="formBaslik">🚗 Hızlı İşlem & Borç Takip</h2>
    
    <div class="form-group">
        <label>Plaka</label>
        <input type="text" id="plaka" placeholder="Örn: 41 ABC 34">
    </div>
    <div class="form-group">
        <label>Müşteri Ad Soyad</label>
        <input type="text" id="musteri" placeholder="Ahmet Yılmaz">
    </div>
    <div class="form-group">
        <label>Müşteri Telefon (Başında 0 olmadan)</label>
        <input type="tel" id="telefon" placeholder="5321234567" maxlength="11">
    </div>
    <div class="form-group">
        <label>Yapılan İşlem / Araç Modeli</label>
        <input type="text" id="islem" placeholder="Örn: Ön Balata Değişimi">
    </div>
    <div class="form-group">
        <label>Toplam Tutar (TL)</label>
        <input type="number" id="toplam" placeholder="5000">
    </div>
    <div class="form-group">
        <label>Alınan Ödenen / Kapora (TL)</label>
        <input type="number" id="odenen" placeholder="1000">
    </div>
    
    <button class="btn-save" id="kaydetBtn" onclick="kaydetVeyaGuncelle()">Kaydet</button>
    <button class="btn-cancel" id="iptalBtn" onclick="duzenlemeIptal()">Düzenlemeyi İptal Et</button>

    <div class="search-box">
        <label>Plaka veya Müşteri Ara</label>
        <input type="text" id="arama" placeholder="Plaka ya da isim yazın..." onkeyup="filtrele()">
    </div>

    <div id="liste"><div class="loading">Veriler Google E-Tablo'dan yükleniyor...</div></div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxyCXck8clmnchRE8frGF1YwdXhdRuDbjW3DHCCTbMfiIerbgwvackT3c4-mFguaVj2/exec";
    
    let kayitlar = [];
    let duzenlenenSatir = null; // Güncelleme modunda Google Sheets satır numarasını tutar
    let duzenlenenTarih = null;

    verileriGetir();

    async function verileriGetir() {
        try {
            let response = await fetch(SCRIPT_URL);
            kayitlar = await response.json();
            listele();
        } catch (error) {
            document.getElementById('liste').innerHTML = '<div class="loading">Veriler yüklenemedi. URL bağlantısını kontrol edin.</div>';
        }
    }

    async function kaydetVeyaGuncelle() {
        let plaka = document.getElementById('plaka').value.toUpperCase().trim();
        let musteri = document.getElementById('musteri').value.trim();
        let telefon = document.getElementById('telefon').value.replace(/\D/g, '');
        let islem = document.getElementById('islem').value.trim();
        let toplam = parseFloat(document.getElementById('toplam').value) || 0;
        let odenen = parseFloat(document.getElementById('odenen').value) || 0;

        if(!plaka || !musteri) {
            alert('Lütfen plaka ve müşteri adını girin!');
            return;
        }

        if(telefon.startsWith('0')) telefon = telefon.substring(1);
        if(telefon.length === 10) telefon = '90' + telefon;

        let kalan = toplam - odenen;
        let islemTuru = duzenlenenSatir ? "update" : "add";
        
        let veriPaketi = { 
            action: islemTuru,
            rowNumber: duzenlenenSatir,
            plaka, musteri, telefon, islem, toplam, odenen, kalan, 
            tarih: duzenlenenSatir ? duzenlenenTarih : new Date().toLocaleDateString('tr-TR') 
        };

        let btn = document.getElementById('kaydetBtn');
        btn.disabled = true;
        btn.innerText = duzenlenenSatir ? "Güncelleniyor..." : "Kaydediliyor...";

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(veriPaketi)
            });

            duzenlemeIptal();
            // Tablodaki güncel satır numaralarını senkronize etmek için verileri yeniden çek
            setTimeout(() => { verileriGetir(); }, 800);
        } catch (error) {
            alert('İşlem sırasında bir hata oluştu.');
        } finally {
            btn.disabled = false;
            btn.innerText = "Kaydet";
        }
    }

    function duzenleBaslat(index) {
        let item = kayitlar[index];
        duzenlenenSatir = item.rowNumber;
        duzenlenenTarih = item.tarih;

        document.getElementById('plaka').value = item.plaka;
        document.getElementById('musteri').value = item.musteri;
        document.getElementById('telefon').value = item.telefon || '';
        document.getElementById('islem').value = item.islem;
        document.getElementById('toplam').value = item.toplam;
        document.getElementById('odenen').value = item.odenen;

        document.getElementById('formBaslik').innerText = "✏️ Kayıt Düzenle / Tahsilat Ekle";
        let btn = document.getElementById('kaydetBtn');
        btn.innerText = "Değişiklikleri Güncelle";
        btn.classList.add('edit-mode');
        document.getElementById('iptalBtn').style.display = "block";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function duzenlemeIptal() {
        duzenlenenSatir = null;
        duzenlenenTarih = null;
        document.getElementById('plaka').value = '';
        document.getElementById('musteri').value = '';
        document.getElementById('telefon').value = '';
        document.getElementById('islem').value = '';
        document.getElementById('toplam').value = '';
        document.getElementById('odenen').value = '';

        document.getElementById('formBaslik').innerText = "🚗 Hızlı İşlem & Borç Takip";
        let btn = document.getElementById('kaydetBtn');
        btn.innerText = "Kaydet";
        btn.classList.remove('edit-mode');
        document.getElementById('iptalBtn').style.display = "none";
    }

    async function kayitSil(index) {
        let item = kayitlar[index];
        if (!confirm(`${item.plaka} plakalı (${item.musteri}) kaydı kalıcı olarak silmek istediğinize emin misiniz?`)) {
            return;
        }

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "delete", rowNumber: item.rowNumber })
            });

            kayitlar.splice(index, 1);
            listele();
            setTimeout(() => { verileriGetir(); }, 800);
        } catch (error) {
            alert('Silme işlemi başarısız oldu.');
        }
    }

    function whatsappGonder(index) {
        let item = kayitlar[index];
        let mesaj = `Sayın ${item.musteri},\n` +
                    `*${item.plaka}* plakalı aracınız için işlem özeti:\n\n` +
                    `📅 *Tarih:* ${item.tarih}\n` +
                    `🔧 *İşlem:* ${item.islem}\n` +
                    `💰 *Toplam Tutar:* ${item.toplam} TL\n` +
                    `✅ *Ödenen:* ${item.odenen} TL\n` +
                    `❗ *Kalan Bakiye:* ${item.kalan} TL\n\n` +
                    `İyi günler dileriz.`;

        let kodlanmisMesaj = encodeURIComponent(mesaj);
        let url = item.telefon 
            ? `https://wa.me/${item.telefon}?text=${kodlanmisMesaj}` 
            : `https://wa.me/?text=${kodlanmisMesaj}`;

        window.open(url, '_blank');
    }

    function listele(gosterilecek = kayitlar) {
        let listeDiv = document.getElementById('liste');
        listeDiv.innerHTML = '';
        
        if(gosterilecek.length === 0) {
            listeDiv.innerHTML = '<div class="loading">Henüz kayıt bulunmuyor.</div>';
            return;
        }

        gosterilecek.forEach((item) => {
            let gercekIndex = kayitlar.indexOf(item);
            listeDiv.innerHTML += `
                <div class="list-item">
                    <div class="item-top">
                        <div>
                            <strong>${item.plaka}</strong> - ${item.musteri}<br>
                            <small style="color:#6b7280">${item.islem} (${item.tarih})</small>
                        </div>
                        <div style="text-align: right;">
                            <div>Toplam: ${item.toplam} ₺</div>
                            <div class="${item.kalan > 0 ? 'debt' : 'paid'}">Kalan: ${item.kalan} ₺</div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn-action btn-wa" onclick="whatsappGonder(${gercekIndex})">📲 WhatsApp</button>
                        <button class="btn-action btn-edit" onclick="duzenleBaslat(${gercekIndex})">✏️ Düzenle</button>
                        <button class="btn-action btn-del" onclick="kayitSil(${gercekIndex})">🗑️ Sil</button>
                    </div>
                </div>`;
        });
    }

    function filtrele() {
        let aranan = document.getElementById('arama').value.toUpperCase();
        let filtrelenmis = kayitlar.filter(item => 
            String(item.plaka).includes(aranan) || String(item.musteri).toUpperCase().includes(aranan)
        );
        listele(filtrelenmis);
    }
</script>

</body>
</html>
